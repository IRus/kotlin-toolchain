product: jvm/lib

description: An executable processor that generates plugin descriptors from plugin sources.

apply:
  - ../../dr.amper.common.module-template.yaml
  - ../dr.amper.uses-aa.module-template.yaml

settings:
  kotlin:
    serialization: enabled

dependencies:
  - ../../amper-telemetry
  - ../amper-schema-processing
  - $kotlin.serialization.json
  - $libs.kotlin.analysis.api.standalone.for.ide

test-dependencies:
  - ../../test-base
  - ../amper-extensibility-api
  - ../amper-extensibility-sdk-stub: runtime-only
